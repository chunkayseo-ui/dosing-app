<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Dosing Lookup</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: var(--tg-theme-bg-color, #F1F7F7);
    --surface: var(--tg-theme-secondary-bg-color, #FFFFFF);
    --ink: var(--tg-theme-text-color, #0C2B30);
    --ink-soft: #4C6B70;
    --teal: #0E7C86;
    --teal-deep: #0A5259;
    --amber: #E2933B;
    --border: #D9EAEA;
    --readout-bg: #0C2B30;
    --readout-cl: #7FE7C4;
    --readout-acid: #FFC97A;
    --ok: #2FA36B;
    --warn: #C1543D;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:16px 16px 40px;
  }
  .wrap{max-width:480px; margin:0 auto;}

  .top{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:8px; padding:0 2px;
  }
  .eyebrow{
    font-size:11px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--teal); font-weight:600;
  }
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:22px; font-weight:700; margin:2px 0 0; letter-spacing:-.01em;
  }

  .sync-row{
    display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-soft);
    margin-bottom:16px; padding:0 2px;
  }
  .sync-dot{width:7px; height:7px; border-radius:50%; background:var(--ink-soft); flex:none;}
  .sync-dot.ok{background:var(--ok);}
  .sync-dot.warn{background:var(--warn);}
  .sync-dot.loading{background:var(--amber); animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .refresh-btn{
    margin-left:auto; border:none; background:none; color:var(--teal); font-weight:600;
    font-size:11.5px; cursor:pointer; padding:2px 4px;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px;
    margin-bottom:14px;
  }
  .label{
    font-size:12px; font-weight:600; color:var(--ink-soft);
    text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px;
  }

  select{
    width:100%; appearance:none; -webkit-appearance:none;
    background:var(--surface) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="9" viewBox="0 0 14 9"><path d="M1 1L7 7L13 1" stroke="%230A5259" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>') no-repeat right 14px center;
    border:1.5px solid var(--border); border-radius:12px;
    padding:14px 40px 14px 14px;
    font-family:'Space Grotesk',sans-serif; font-size:16px; font-weight:600; color:var(--ink);
  }

  .seg{
    display:flex; background:var(--bg); border-radius:12px; padding:4px; gap:4px;
  }
  .seg button{
    flex:1; border:none; background:transparent; padding:10px 8px;
    border-radius:9px; font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px;
    color:var(--ink-soft); cursor:pointer;
  }
  .seg button.active{background:var(--teal); color:#fff;}
  .auto-note{font-size:11.5px; color:var(--ink-soft); margin-top:8px;}

  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    border:1.5px solid var(--border); background:var(--bg);
    color:var(--ink); font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:14.5px;
    padding:10px 14px; border-radius:10px; cursor:pointer; min-width:56px; text-align:center;
  }
  .chip.active{background:var(--teal-deep); border-color:var(--teal-deep); color:#fff;}

  .readout{
    background:var(--readout-bg); border-radius:18px; padding:20px 18px 18px;
    color:#fff; position:relative; overflow:hidden;
  }
  .readout::before{
    content:""; position:absolute; inset:0;
    background:radial-gradient(120% 100% at 0% 0%, rgba(127,231,196,0.08), transparent 60%);
  }
  .readout-head{
    display:flex; justify-content:space-between; align-items:center;
    font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:#8FB3B3;
    margin-bottom:14px; position:relative;
  }
  .readout-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; position:relative;}
  .dose-label{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:#8FB3B3; margin-bottom:4px;}
  .dose-value{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:26px; line-height:1.1;}
  .dose-value.cl{color:var(--readout-cl);}
  .dose-value.acid{color:var(--readout-acid);}
  .readout-foot{
    margin-top:16px; padding-top:12px; border-top:1px solid rgba(255,255,255,0.12);
    font-size:12px; color:#8FB3B3; position:relative;
  }

  .empty{
    text-align:center; color:var(--ink-soft); font-size:13.5px; padding:18px 8px;
  }

  .note{
    font-size:12px; color:var(--ink-soft); line-height:1.5; padding:0 4px; margin-top:2px;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div>
      <div class="eyebrow">Dosing Lookup</div>
      <h1 id="outletName">—</h1>
    </div>
  </div>

  <div class="sync-row">
    <span class="sync-dot loading" id="syncDot"></span>
    <span id="syncText">Syncing with sheet…</span>
    <button class="refresh-btn" id="refreshBtn">Refresh</button>
  </div>

  <div class="card">
    <div class="label">Outlet</div>
    <select id="outletSelect"></select>
  </div>

  <div class="card">
    <div class="label">Schedule</div>
    <div class="seg">
      <button id="btnWeekday" class="active">Weekday</button>
      <button id="btnWeekend">Weekend</button>
    </div>
    <div class="auto-note" id="autoNote"></div>
  </div>

  <div class="card">
    <div class="label">FC</div>
    <div class="chips" id="fcChips"></div>
  </div>

  <div class="card">
    <div class="label">PH</div>
    <div class="chips" id="phChips"></div>
  </div>

  <div class="readout">
    <div class="readout-head">
      <span id="readoutSchedule">Weekday</span>
      <span id="readoutCoords">—</span>
    </div>
    <div id="readoutBody">
      <div class="empty">Select FC and PH to see dosing</div>
    </div>
  </div>

  <p class="note">Bicarb / Salt dosing isn't included yet. Data syncs live from the Google Sheet — if the sheet layout changes significantly, ask for an update here.</p>

</div>

function fmtAmt(v, unit){
  const trimmed = (v % 1 === 0) ? v.toFixed(0) : String(v);
  return trimmed + ' ' + (UNIT_LABEL[unit] || unit);
}

// ---------- CSV parsing ----------
function parseCSV(text){
  const rows = []; let row = []; let field = ''; let inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){
        if (text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ','){ row.push(field); field = ''; }
      else if (c === '\r'){ /* skip */ }
      else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else field += c;
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

function parseDose(cellText){
  if (!cellText) return null;
  const s = String(cellText);
  const parts = s.split(/\n+/);
  let cl = null, acid = null;
  for (const raw of parts){
    const p = raw.trim();
    if (!p) continue;
    let m = p.match(/Chlorine\s*:\s*([\d.]+)\s*([a-zA-Z]*)/i);
    if (m){ cl = { val: parseFloat(m[1]), unit: (m[2] || 'g').toLowerCase() }; continue; }
    m = p.match(/Acid\s*:\s*([\d.]+)\s*([a-zA-Z]*)/i);
    if (m){ acid = { val: parseFloat(m[1]), unit: (m[2] || 'ml').toLowerCase() }; continue; }
  }
  if (!cl || !acid) return null;
  return { cl: cl.val, clUnit: cl.unit, acid: acid.val, acidUnit: acid.unit };
}

function isNumericCell(v){
  return v !== undefined && v !== null && v.trim() !== '' && !isNaN(parseFloat(v)) && /^-?\d+(\.\d+)?$/.test(v.trim());
}

function parseOutletCSV(csvText, displayName){
  const rows = parseCSV(csvText);
  const tables = [];
  let i = 0;
  while (i < rows.length){
    const row = rows[i];
    if (row[0] && row[0].trim().toUpperCase().startsWith('FC/PH')){
      const ph = [1,2,3,4,5].map(k => parseFloat(row[k]));
      const dataRows = [];
      let j = i + 1;
      while (j < rows.length && isNumericCell(rows[j][0])){
        const fc = parseFloat(rows[j][0]);
        const doses = [1,2,3,4,5].map(k => parseDose(rows[j][k]));
        if (doses.some(d => d === null)) break; // malformed row, stop this table
        dataRows.push([fc, doses]);
        j++;
      }
      tables.push({ ph, rows: dataRows });
      i = j;
    } else {
      i++;
    }
  }
  if (tables.length < 1) return null;
  const build = (t) => {
    const fc = t.rows.map(r => r[0]);
    const grid = {};
    t.rows.forEach(r => { grid[String(r[0])] = r[1]; });
    return { fc, ph: t.ph, grid };
  };
  const entry = { name: displayName };
  entry.weekday = build(tables[0]);
  if (tables.length >= 2) entry.weekend = build(tables[1]);
  return entry;
}

// ---------- Live sync ----------
async function fetchOutletLive(key){
  const sheetName = SHEET_NAMES[key];
  const url = 'https://docs.google.com/spreadsheets/d/' + SPREADSHEET_ID +
              '/gviz/tq?tqx=out:csv&sheet=' + encodeURIComponent(sheetName);
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();
  const displayName = FALLBACK_OUTLETS[key] ? FALLBACK_OUTLETS[key].name : key;
  const parsed = parseOutletCSV(text, displayName);
  if (!parsed) throw new Error('parse failed for ' + key);
  return parsed;
}

async function syncAll(){
  setSyncStatus('loading', 'Syncing with sheet…');
  const keys = Object.keys(SHEET_NAMES);
  const results = await Promise.allSettled(keys.map(fetchOutletLive));
  let okCount = 0;
  const next = JSON.parse(JSON.stringify(OUTLETS));
  results.forEach((r, idx) => {
    const key = keys[idx];
    if (r.status === 'fulfilled'){
      next[key] = r.value;
      okCount++;
    }
  });
  if (okCount > 0){
    OUTLETS = next;
    try { localStorage.setItem(LS_KEY, JSON.stringify({ data: OUTLETS, ts: Date.now() })); } catch(e){}
  }
  if (okCount === keys.length){
    setSyncStatus('ok', 'Synced just now');
  } else if (okCount > 0){
    setSyncStatus('warn', `Synced ${okCount}/${keys.length} outlets — some using saved data`);
  } else {
    setSyncStatus('warn', 'Could not reach sheet — showing saved data');
  }
  render();
}

  const phIndex = table.ph.indexOf(state.ph);
  const dose = table.grid[String(state.fc)][phIndex];
  readoutCoords.textContent = `FC ${fmtFc(state.fc)} · PH ${state.ph.toFixed(1)}`;

  readoutBody.innerHTML = `
    <div class="readout-grid">
      <div class="dose-block">
        <div class="dose-label">Chlorine</div>
        <div class="dose-value cl">${fmtAmt(dose.cl, dose.clUnit)}</div>
      </div>
      <div class="dose-block">
        <div class="dose-label">Acid</div>
        <div class="dose-value acid">${fmtAmt(dose.acid, dose.acidUnit)}</div>
      </div>
    </div>
    <div class="readout-foot">${OUTLETS[state.outlet].name} · ${state.schedule === 'weekday' ? 'Mon–Fri' : 'Weekend'}</div>
  `;
}

function render(){
  const outlet = OUTLETS[state.outlet];
  outletName.textContent = outlet.name;
  if (!outlet[state.schedule]) state.schedule = outlet.weekday ? 'weekday' : 'weekend';
  renderScheduleToggle();
  renderChips();
  renderReadout();
}

outletSelect.onchange = () => { state.outlet = outletSelect.value; state.fc = null; state.ph = null; render(); };
btnWeekday.onclick = () => { state.schedule = 'weekday'; state.fc = null; state.ph = null; render(); };
btnWeekend.onclick = () => { state.schedule = 'weekend'; state.fc = null; state.ph = null; render(); };
document.getElementById('refreshBtn').onclick = () => { syncAll(); };

// Load cached live data if present (faster than waiting on network), then sync
try {
  const cached = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
  if (cached && cached.data){
    OUTLETS = cached.data;
    const mins = Math.round((Date.now() - cached.ts) / 60000);
    setSyncStatus('ok', mins < 1 ? 'Using data from last sync' : `Using data from ${mins}m ago`);
  }
} catch(e){}

render();
syncAll();
</script>
</body>
</html>
