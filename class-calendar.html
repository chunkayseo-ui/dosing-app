<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Class Calendar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://script.google.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: var(--tg-theme-bg-color, #F1F7F7);
    --surface: var(--tg-theme-secondary-bg-color, #FFFFFF);
    --ink: var(--tg-theme-text-color, #0C2B30);
    --ink-soft: #4C6B70;
    --teal: #0E7C86;
    --teal-deep: #0A5259;
    --amber: #E2933B;
    --border: #D9EAEA;
    --ok: #2FA36B;
    --warn: #C1543D;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif;
    min-height:100vh; padding:16px 16px 40px;
  }
  .wrap{max-width:480px; margin:0 auto;}

  .top{margin-bottom:8px; padding:0 2px;}
  .eyebrow{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--teal); font-weight:600;}
  h1{font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:700; margin:2px 0 0; letter-spacing:-.01em;}

  .sync-row{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-soft); margin-bottom:16px; padding:0 2px;}
  .sync-dot{width:7px; height:7px; border-radius:50%; background:var(--ink-soft); flex:none;}
  .sync-dot.ok{background:var(--ok);}
  .sync-dot.warn{background:var(--warn);}
  .sync-dot.loading{background:var(--amber); animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:14px;}
  .label{font-size:12px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px;}

  select{
    width:100%; appearance:none; -webkit-appearance:none;
    background:var(--surface) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="9" viewBox="0 0 14 9"><path d="M1 1L7 7L13 1" stroke="%230A5259" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>') no-repeat right 14px center;
    border:1.5px solid var(--border); border-radius:12px; padding:14px 40px 14px 14px;
    font-family:'Space Grotesk',sans-serif; font-size:16px; font-weight:600; color:var(--ink);
  }

  /* ---- Today card: the answer this page is usually opened for, so it sits
         first, opens expanded, and never waits for a fresh network reply if a
         saved copy is on the phone. ---- */
  .today-card{
    background:linear-gradient(180deg,#EFFAF8 0%, var(--surface) 62%);
    border-color:#B9E2DC;
  }
  .today-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px;}
  .today-label{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--teal); font-weight:700;}
  .today-date{font-family:'Space Grotesk',sans-serif; font-size:19px; font-weight:700; margin-top:2px;}
  .today-times{display:flex; gap:16px; flex:none;}
  .today-time-block{text-align:right;}
  .today-time-label{font-size:9px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-soft);}
  .today-time-value{font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:700; line-height:1.15;}
  .today-time-value.first{color:var(--teal-deep);}
  .today-time-value.last{color:var(--amber);}
  .today-closed{font-family:'Space Grotesk',sans-serif; font-size:16px; font-weight:700; color:var(--ink-soft);}
  .today-blocks{margin-top:14px; padding-top:12px; border-top:1px solid var(--border);}
  .today-blocks:empty{display:none;}
  /* a busy Saturday runs to 50+ classes, so the list stays folded behind its
     own summary -- the start and end times are what the page is opened for */
  .today-count{
    display:flex; align-items:center; gap:7px; cursor:pointer;
    font-size:12px; font-weight:600; color:var(--teal-deep);
  }
  .today-count .chev{font-size:10px; color:var(--ink-soft); transition:transform .15s;}
  .today-count.open .chev{transform:rotate(90deg);}
  .today-count .gaps{color:var(--warn); font-weight:600;}
  .today-list{display:none; margin-top:11px;}
  .today-list.open{display:block;}
  .today-note{font-size:11.5px; color:var(--ink-soft);}

  /* skeleton, shown only on a genuinely first-ever load for a pool */
  .skel{background:linear-gradient(90deg,#E6F1F1 25%,#F2F8F8 50%,#E6F1F1 75%); background-size:200% 100%;
    animation:shimmer 1.1s infinite; border-radius:7px; height:13px;}
  .skel.big{height:22px; width:108px;}
  .skel.line{margin-top:9px; width:70%;}
  @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

  .month-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .month-nav-btn{
    width:36px; height:36px; border-radius:10px; border:1.5px solid var(--border);
    background:var(--bg); color:var(--teal-deep); font-size:16px; font-weight:700;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .month-nav-label{font-family:'Space Grotesk',sans-serif; font-size:16px; font-weight:700;}

  .day-list{display:flex; flex-direction:column;}
  .day-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 4px; border-bottom:1px solid var(--border);
    cursor:pointer;
  }
  .day-row:last-child{border-bottom:none;}
  .day-row.today{background:#EFFAF6; margin:0 -16px; padding-left:16px; padding-right:16px; border-radius:10px; border-bottom:1px solid transparent;}
  .day-left{display:flex; align-items:baseline; gap:8px;}
  .day-dow{font-size:11.5px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; width:32px;}
  .day-date{font-family:'Space Grotesk',sans-serif; font-size:17px; font-weight:700; color:var(--ink);}
  .day-times{display:flex; align-items:center; gap:14px;}
  .day-time-block{text-align:right;}
  .day-time-label{font-size:9px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-soft);}
  .day-time-value{font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:700;}
  .day-time-value.first{color:var(--teal-deep);}
  .day-time-value.last{color:var(--amber);}
  .day-closed{font-size:13px; color:var(--ink-soft);}
  .day-past{opacity:.55;}

  .day-wrap{border-bottom:1px solid var(--border);}
  .day-wrap:last-child{border-bottom:none;}
  .day-wrap .day-row{border-bottom:none;}
  .day-chevron{font-size:11px; color:var(--ink-soft); margin-left:8px; transition:transform .15s;}
  .day-wrap.expanded .day-chevron{transform:rotate(90deg);}
  .day-detail{display:none; padding:0 4px 16px 44px;}
  .day-wrap.expanded .day-detail{display:block;}
  .block-row{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .block-row:last-child{margin-bottom:0;}
  .block-dot{width:7px; height:7px; border-radius:50%; background:var(--teal); flex:none;}
  .block-time{font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; color:var(--ink);}
  .block-row.past .block-dot{background:var(--border);}
  .block-row.past .block-time{color:var(--ink-soft);}
  .gap-row{
    display:flex; align-items:center; gap:10px; margin:2px 0 10px;
    font-size:11.5px; color:var(--warn); font-weight:600;
  }
  .gap-line{width:7px; border-top:2px dashed var(--warn); flex:none;}

  .legend{display:flex; gap:14px; margin-top:14px; flex-wrap:wrap;}
  .legend-item{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-soft);}
  .legend-dot{width:9px; height:9px; border-radius:3px; flex:none;}

  .empty-state{text-align:center; color:var(--ink-soft); font-size:13.5px; padding:30px 8px;}

</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="eyebrow">Class Calendar</div>
    <h1 id="outletTitle">Select a pool</h1>
  </div>

  <div class="sync-row">
    <span class="sync-dot loading" id="syncDot"></span>
    <span id="syncText">Select a pool to begin</span>
  </div>

  <div class="card">
    <div class="label">Swimming Pool</div>
    <select id="outletSelect"></select>
  </div>

  <div class="card today-card" id="todayCard" style="display:none;">
    <div class="today-head">
      <div>
        <div class="today-label">Today</div>
        <div class="today-date" id="todayDate">—</div>
      </div>
      <div id="todayTimes"></div>
    </div>
    <div class="today-blocks" id="todayBlocks"></div>
  </div>

  <div class="card" id="calCard" style="display:none;">
    <div class="month-nav">
      <button class="month-nav-btn" id="prevMonthBtn">&lsaquo;</button>
      <div class="month-nav-label" id="monthLabel">—</div>
      <button class="month-nav-btn" id="nextMonthBtn">&rsaquo;</button>
    </div>
    <div class="day-list" id="calGrid"></div>
    <div class="legend">
      <div class="legend-item"><span class="legend-dot" style="background:#0E7C86;"></span>First class starts</div>
      <div class="legend-item"><span class="legend-dot" style="background:#E2933B;"></span>Last class ends</div>
    </div>
  </div>

</div>

<script>
const HISTORY_API_URL = 'https://script.google.com/macros/s/AKfycbwYJLfkw5lwKnjwqmEtuRiREzbahnf2l63YhmX_7jMR9uqM9MpeqoxeVTTVw5rc76eZ6g/exec';

const OUTLET_NAMES = {
  WWW:'WWW', JEIP1:'JEIP 1', JEIP2:'JEIP 2', JEOP1:'JEOP 1', JEOP2:'JEOP 2',
  Tengah:'Tengah', HS:'HS', TPY:'TPY', DR:'DR', Lentor:'Lentor', BK:'BK', HB:'HB', CC:'CC'
};

/* The class schedule for a month is about 20 KB and the whole wait is the
   Apps Script round trip (2-6 s), so the fix is not to fetch less but to stop
   waiting for it: keep the last answer on the phone, draw from it at once,
   then quietly check for a newer one. */
const LS_OUTLET = 'cal.outlet';
const LS_PREFIX = 'cal.month.';
const LS_KEEP   = 24;   // saved months to keep before pruning the oldest
const LS_MAXAGE = 90;   // days

const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }

const outletSelect = document.getElementById('outletSelect');
const outletTitle  = document.getElementById('outletTitle');
const calCard      = document.getElementById('calCard');
const calGrid      = document.getElementById('calGrid');
const monthLabel   = document.getElementById('monthLabel');
const todayCard    = document.getElementById('todayCard');

let calCache = {};                                    // { "WWW_2026-09": data }
let state = { outlet:null, year:null, month:null };   // month is 1-12
let todayListOpen = false;                            // survives a background redraw

const today = new Date();
state.year  = today.getFullYear();
state.month = today.getMonth() + 1;
const TODAY_KEY = ymd(today);
const CUR_MONTH = TODAY_KEY.slice(0, 7);

function pad(n){ return String(n).padStart(2, '0'); }
function ymd(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

function setSyncStatus(kind, text){
  document.getElementById('syncDot').className = 'sync-dot ' + kind;
  document.getElementById('syncText').textContent = text;
}

/* ---------- saved copies on the phone ---------- */
function lsGet(key){
  try {
    const raw = localStorage.getItem(LS_PREFIX + key);
    if (!raw) return null;
    const box = JSON.parse(raw);
    if (!box || !box.data) return null;
    return box;
  } catch(e){ return null; }
}
function lsPut(key, data){
  try {
    localStorage.setItem(LS_PREFIX + key, JSON.stringify({ savedAt: Date.now(), data: data }));
    prune();
  } catch(e){
    // out of room (or private mode): drop what we have and try once more
    try { prune(true); localStorage.setItem(LS_PREFIX + key, JSON.stringify({ savedAt: Date.now(), data: data })); } catch(e2){}
  }
}
function prune(hard){
  try {
    const rows = [];
    for (let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if (k && k.indexOf(LS_PREFIX) === 0){
        let at = 0;
        try { at = (JSON.parse(localStorage.getItem(k)) || {}).savedAt || 0; } catch(e){}
        rows.push({ k:k, at:at });
      }
    }
    const cutoff = Date.now() - LS_MAXAGE * 86400000;
    rows.sort((a,b) => b.at - a.at);
    rows.forEach((r, i) => {
      if (hard ? i >= 4 : (i >= LS_KEEP || r.at < cutoff)) localStorage.removeItem(r.k);
    });
  } catch(e){}
}

/* ---------- pool picker ---------- */
Object.keys(OUTLET_NAMES).forEach(key => {
  const opt = document.createElement('option');
  opt.value = key; opt.textContent = OUTLET_NAMES[key];
  outletSelect.appendChild(opt);
});
const placeholder = document.createElement('option');
placeholder.value = ''; placeholder.textContent = 'Select a pool…'; placeholder.disabled = true; placeholder.selected = true;
outletSelect.insertBefore(placeholder, outletSelect.firstChild);
outletSelect.value = '';

outletSelect.onchange = () => {
  if (tg) tg.HapticFeedback.impactOccurred('light');
  pickOutlet(outletSelect.value);
};

function pickOutlet(code){
  if (!code || !OUTLET_NAMES[code]) return;
  state.outlet = code;
  state.year  = today.getFullYear();
  state.month = today.getMonth() + 1;
  outletSelect.value = code;
  outletTitle.textContent = OUTLET_NAMES[code];
  todayCard.style.display = 'block';
  calCard.style.display = 'block';
  try { localStorage.setItem(LS_OUTLET, code); } catch(e){}
  loadMonth();
}

document.getElementById('prevMonthBtn').onclick = () => {
  if (tg) tg.HapticFeedback.impactOccurred('light');
  state.month--;
  if (state.month < 1){ state.month = 12; state.year--; }
  loadMonth();
};
document.getElementById('nextMonthBtn').onclick = () => {
  if (tg) tg.HapticFeedback.impactOccurred('light');
  state.month++;
  if (state.month > 12){ state.month = 1; state.year++; }
  loadMonth();
};

function monthKey(){ return state.year + '-' + pad(state.month); }

/* ---------- loading ---------- */
/* Draw whatever is already on the phone straight away, then check the server
   in the background and redraw only if the answer actually changed. */
async function loadMonth(){
  if (!state.outlet) return;
  const mk  = monthKey();
  const key = state.outlet + '_' + mk;
  monthLabel.textContent = new Date(state.year, state.month - 1, 1)
    .toLocaleDateString('en-US', { month:'long', year:'numeric' });

  let shown = false;
  if (calCache[key]){
    draw(calCache[key], mk);
    shown = true;
  } else {
    const box = lsGet(key);
    if (box){
      calCache[key] = box.data;
      draw(box.data, mk);
      shown = true;
      setSyncStatus('ok', 'Saved copy · checking for changes…');
    }
  }
  if (!shown){
    drawSkeleton(mk);
    setSyncStatus('loading', 'Loading…');
  }

  try {
    const url = HISTORY_API_URL + '?classes=1&outlet=' + encodeURIComponent(state.outlet) +
                '&month=' + mk + '&_=' + Date.now();
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    if (state.outlet + '_' + monthKey() !== key) return;   // they moved on while we waited

    const changed = JSON.stringify(calCache[key]) !== JSON.stringify(data);
    calCache[key] = data;
    lsPut(key, data);
    if (changed || !shown) draw(data, mk);
    setSyncStatus('ok', shown && !changed ? 'Up to date' : 'Updated just now');
  } catch(e){
    if (shown) setSyncStatus('warn', 'Showing saved copy — could not reach the server');
    else {
      setSyncStatus('warn', 'Could not load class schedule');
      todayBlank('Could not load today’s classes. Try again shortly.');
      calGrid.innerHTML = '<div class="empty-state">Could not load this month’s classes. Try again shortly.</div>';
    }
  }
}

function draw(data, mk){
  if (mk === CUR_MONTH) renderToday(data);
  renderCalendar(data);
}

/* ---------- formatting ---------- */
function fmtTime12(hhmm){
  const parts = String(hhmm).split(':').map(Number);
  const h = parts[0], m = parts[1] || 0;
  const period = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return h12 + ':' + pad(m) + period;
}
function toMinutes(hhmm){
  const parts = String(hhmm).split(':').map(Number);
  return parts[0] * 60 + (parts[1] || 0);
}
function fmtGap(mins){
  const h = Math.floor(mins / 60), m = mins % 60;
  if (h === 0) return m + 'm gap';
  if (m === 0) return h + 'h gap';
  return h + 'h ' + m + 'm gap';
}
const GAP_THRESHOLD_MIN = 45;   // shorter than this is just changeover time

function blocksHtml(blocks, markPast){
  const nowMin = today.getHours() * 60 + today.getMinutes();
  let html = '';
  blocks.forEach((block, i) => {
    if (i > 0){
      const gap = toMinutes(block.start) - toMinutes(blocks[i-1].end);
      if (gap >= GAP_THRESHOLD_MIN){
        html += '<div class="gap-row"><span class="gap-line"></span>' + fmtGap(gap) + ' — free for maintenance</div>';
      }
    }
    const past = markPast && toMinutes(block.end) <= nowMin;
    html += '<div class="block-row' + (past ? ' past' : '') + '"><span class="block-dot"></span>' +
            '<span class="block-time">' + fmtTime12(block.start) + ' – ' + fmtTime12(block.end) + '</span></div>';
  });
  return html;
}

/* ---------- today ---------- */
function todayDateText(){
  return today.toLocaleDateString('en-US', { weekday:'short', day:'numeric', month:'short' });
}
function drawSkeletonToday(){
  document.getElementById('todayDate').textContent = todayDateText();
  document.getElementById('todayTimes').innerHTML = '<div class="skel big"></div>';
  document.getElementById('todayBlocks').innerHTML = '<div class="skel line"></div><div class="skel line"></div>';
}
function todayBlank(msg){
  document.getElementById('todayDate').textContent = todayDateText();
  document.getElementById('todayTimes').innerHTML = '';
  document.getElementById('todayBlocks').innerHTML = '<div class="today-note">' + msg + '</div>';
}
function countGaps(blocks){
  let n = 0;
  for (let i = 1; i < blocks.length; i++){
    if (toMinutes(blocks[i].start) - toMinutes(blocks[i-1].end) >= GAP_THRESHOLD_MIN) n++;
  }
  return n;
}
function renderToday(data){
  const info = data[TODAY_KEY];
  document.getElementById('todayDate').textContent = todayDateText();

  if (!info){
    document.getElementById('todayTimes').innerHTML = '<div class="today-closed">Closed</div>';
    document.getElementById('todayBlocks').innerHTML = '';
    return;
  }
  document.getElementById('todayTimes').innerHTML =
    '<div class="today-times">' +
      '<div class="today-time-block"><div class="today-time-label">Starts</div>' +
        '<div class="today-time-value first">' + fmtTime12(info.first) + '</div></div>' +
      '<div class="today-time-block"><div class="today-time-label">Ends</div>' +
        '<div class="today-time-value last">' + fmtTime12(info.last) + '</div></div>' +
    '</div>';

  const blocks = info.blocks || [];
  const box = document.getElementById('todayBlocks');
  if (!blocks.length){ box.innerHTML = ''; return; }

  const n    = info.count || blocks.length;
  const gaps = countGaps(blocks);
  box.innerHTML =
    '<div class="today-count" id="todayCount"><span class="chev">▸</span>' +
      '<span>' + n + ' class' + (n === 1 ? '' : 'es') + ' today</span>' +
      (gaps ? '<span class="gaps">· ' + gaps + ' maintenance gap' + (gaps === 1 ? '' : 's') + '</span>' : '') +
    '</div>' +
    '<div class="today-list" id="todayList">' + blocksHtml(blocks, true) + '</div>';

  const head = document.getElementById('todayCount');
  const list = document.getElementById('todayList');
  if (todayListOpen){ head.classList.add('open'); list.classList.add('open'); }
  head.onclick = () => {
    todayListOpen = !todayListOpen;
    head.classList.toggle('open', todayListOpen);
    list.classList.toggle('open', todayListOpen);
    if (tg) tg.HapticFeedback.impactOccurred('light');
  };
}

/* ---------- month list ---------- */
function drawSkeleton(mk){
  if (mk === CUR_MONTH) drawSkeletonToday();
  let html = '';
  for (let i = 0; i < 6; i++){
    html += '<div class="day-row"><div class="day-left"><div class="skel" style="width:28px"></div>' +
            '<div class="skel" style="width:20px"></div></div><div class="skel" style="width:96px"></div></div>';
  }
  calGrid.innerHTML = html;
}

function renderCalendar(data){
  calGrid.innerHTML = '';
  const dowLabels = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const daysInMonth = new Date(state.year, state.month, 0).getDate();

  for (let day = 1; day <= daysInMonth; day++){
    const dateKey = state.year + '-' + pad(state.month) + '-' + pad(day);
    const info    = data[dateKey];
    const dow     = new Date(state.year, state.month - 1, day).getDay();
    const isToday = dateKey === TODAY_KEY;
    const isPast  = dateKey < TODAY_KEY;

    const wrap = document.createElement('div');
    wrap.className = 'day-wrap';

    const row = document.createElement('div');
    row.className = 'day-row' + (isToday ? ' today' : '') + (isPast ? ' day-past' : '');

    let timesHtml;
    if (info){
      timesHtml =
        '<div class="day-times">' +
          '<div class="day-time-block"><div class="day-time-label">Starts</div>' +
            '<div class="day-time-value first">' + fmtTime12(info.first) + '</div></div>' +
          '<div class="day-time-block"><div class="day-time-label">Ends</div>' +
            '<div class="day-time-value last">' + fmtTime12(info.last) + '</div></div>' +
          '<div class="day-chevron">▸</div>' +
        '</div>';
    } else {
      timesHtml = '<div class="day-closed">Closed</div>';
    }

    row.innerHTML =
      '<div class="day-left">' +
        '<div class="day-dow">' + dowLabels[dow] + '</div>' +
        '<div class="day-date">' + day + '</div>' +
      '</div>' + timesHtml;
    wrap.appendChild(row);

    if (info && info.blocks && info.blocks.length){
      const detail = document.createElement('div');
      detail.className = 'day-detail';
      detail.innerHTML = blocksHtml(info.blocks, false);
      wrap.appendChild(detail);
      row.onclick = () => { wrap.classList.toggle('expanded'); };
    }

    calGrid.appendChild(wrap);
  }
}

/* ---------- open straight into the pool used last time ---------- */
(function start(){
  let last = null;
  try { last = localStorage.getItem(LS_OUTLET); } catch(e){}
  if (last && OUTLET_NAMES[last]) pickOutlet(last);
})();
</script>
